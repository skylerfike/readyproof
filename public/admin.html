<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadyProof — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafafa;
      --white: #ffffff;
      --border: #e0e0e0;
      --border2: #d0d0d0;
      --ink: #000000;
      --ink-mid: #666666;
      --ink-faint: #999999;
      --accent: #000000;
      --accent-light: #f5f5f5;
      --green: #000000;
      --green-light: #f5f5f5;
      --red: #000000;
      --red-light: #f5f5f5;
      --blue: #000000;
      --blue-light: #f5f5f5;
      --amber: #000000;
      --amber-light: #f5f5f5;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; font-size: 14px; }

    /* ── Auth ── */
    .auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; }
    .auth-logo { font-family: 'DM Sans', serif; font-size: 36px; font-weight: 300; letter-spacing: 0.08em; }
    .auth-sub { font-size: 13px; color: var(--ink-mid); letter-spacing: 0.04em; }
    .auth-box { background: var(--white); border: 1px solid var(--border); padding: 32px; display: flex; flex-direction: column; gap: 12px; width: 320px; box-shadow: var(--shadow); }
    .auth-input { border: 1px solid var(--border2); padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); outline: none; width: 100%; }
    .auth-input:focus { border-color: var(--ink); }
    .auth-btn { background: var(--ink); color: white; border: none; padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; letter-spacing: 0.04em; }
    .auth-btn:hover { background: #333; }
    .auth-error { color: var(--red); font-size: 12px; text-align: center; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar { background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid var(--border); }
    .sidebar-logo h1 { font-family: 'DM Sans', serif; font-size: 22px; font-weight: 400; letter-spacing: 0.06em; color: var(--ink); }
    .sidebar-logo p { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.04em; margin-top: 2px; }
    .sidebar-nav { padding: 12px 0; flex: 1; overflow-y: auto; }
    .nav-section { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); padding: 12px 20px 4px; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 20px; cursor: pointer; font-size: 13px; color: var(--ink-mid); border-left: 2px solid transparent; transition: all 0.12s; }
    .nav-item:hover { background: var(--bg); color: var(--ink); }
    .nav-item.active { background: var(--gold-light); color: var(--ink); border-left-color: var(--gold); font-weight: 500; }
    .nav-badge { font-size: 11px; background: var(--border); padding: 1px 7px; border-radius: 10px; color: var(--ink-mid); }
    .nav-badge.alert { background: var(--amber-light); color: var(--amber); }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }

    /* ── Main ── */
    .main { padding: 32px; max-width: 1100px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header h2 { font-family: 'DM Sans', serif; font-size: 28px; font-weight: 400; }
    .page-actions { display: flex; gap: 8px; }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--white); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow-sm); }
    .stat-value { font-family: 'DM Sans', serif; font-size: 40px; font-weight: 300; color: var(--ink); line-height: 1; }
    .stat-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-top: 6px; }
    .stat-card.highlight .stat-value { color: var(--amber); }

    /* ── Session cards ── */
    .sessions-grid { display: flex; flex-direction: column; gap: 10px; }
    .session-card { background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--border); padding: 20px 24px; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s; }
    .session-card:hover { box-shadow: var(--shadow); }
    .session-card[data-status="pending"]   { border-left-color: var(--ink-faint); }
    .session-card[data-status="reviewing"] { border-left-color: var(--blue); }
    .session-card[data-status="submitted"] { border-left-color: var(--amber); }
    .session-card[data-status="editing"]   { border-left-color: var(--gold); }
    .session-card[data-status="complete"]  { border-left-color: var(--green); }

    .session-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .session-name { font-family: 'DM Sans', serif; font-size: 20px; font-weight: 400; }
    .session-email { font-size: 12px; color: var(--ink-mid); margin-top: 1px; }

    .status-pill { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; padding: 4px 10px; font-weight: 500; white-space: nowrap; }
    .status-pending   { background: var(--bg); color: var(--ink-faint); border: 1px solid var(--border); }
    .status-reviewing { background: var(--blue-light); color: var(--blue); }
    .status-submitted { background: var(--amber-light); color: var(--amber); }
    .status-editing   { background: var(--gold-light); color: var(--gold); }
    .status-complete  { background: var(--green-light); color: var(--green); }

    .session-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-mid); margin-bottom: 14px; align-items: center; }
    .session-meta strong { color: var(--ink); }
    .payment-badge { font-size: 11px; padding: 2px 8px; border-radius: 2px; }
    .payment-paid   { background: var(--green-light); color: var(--green); }
    .payment-unpaid { background: var(--red-light); color: var(--red); }
    .payment-partial { background: var(--amber-light); color: var(--amber); }

    .gallery-link-row { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); padding: 7px 12px; margin-bottom: 12px; }
    .gallery-link-text { font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-mid); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-action { background: none; border: none; font-size: 12px; color: var(--blue); cursor: pointer; white-space: nowrap; padding: 0 4px; }
    .link-action:hover { text-decoration: underline; }

    .session-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.03em; cursor: pointer; border: none; transition: all 0.12s; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-primary { background: var(--ink); color: white; }
    .btn-primary:hover { background: #333; }
    .btn-outline { background: none; border: 1px solid var(--border2); color: var(--ink-mid); }
    .btn-outline:hover { border-color: var(--ink); color: var(--ink); }
    .btn-gold { background: var(--gold); color: white; }
    .btn-gold:hover { background: #b08050; }
    .btn-success { background: var(--green-light); border: 1px solid rgba(58,140,92,0.3); color: var(--green); }
    .btn-success:hover { background: #d4edde; }
    .btn-danger { background: var(--red-light); border: 1px solid rgba(201,64,64,0.25); color: var(--red); }
    .btn-danger:hover { background: #fde4e4; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(26,24,20,0.4); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--white); max-width: 580px; width: 100%; padding: 32px; position: relative; box-shadow: 0 8px 40px rgba(26,24,20,0.15); max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'DM Sans', serif; font-size: 24px; font-weight: 400; margin-bottom: 24px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-faint); }
    .modal-close:hover { color: var(--ink); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }

    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 6px; }
    .form-row input, .form-row textarea, .form-row select {
      width: 100%; border: 1px solid var(--border2); padding: 10px 12px;
      color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.12s; background: white;
    }
    .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--ink); }
    .form-row .hint { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* ── Brief panel ── */
    .brief-panel { background: var(--bg); border: 1px solid var(--border); padding: 20px; margin-top: 10px; display: none; }
    .brief-panel.open { display: block; }
    .brief-panel h4 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
    .brief-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .brief-item:last-child { border-bottom: none; }
    .brief-num { color: var(--ink-faint); width: 28px; font-size: 11px; flex-shrink: 0; }
    .brief-filename { font-family: 'Courier New', monospace; color: var(--ink); }
    .brief-fav { color: var(--gold); }
    .brief-note { color: var(--ink-mid); font-style: italic; font-size: 12px; }

    /* ── Orders panel ── */
    .order-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .order-item:last-child { border-bottom: none; }
    .order-type { font-weight: 500; font-size: 13px; }
    .order-detail { font-size: 12px; color: var(--ink-mid); margin-top: 2px; }
    .order-status { font-size: 11px; padding: 2px 8px; }

    /* ── Settings page ── */
    .settings-section { background: var(--white); border: 1px solid var(--border); padding: 28px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .settings-section h3 { font-family: 'DM Sans', serif; font-size: 20px; font-weight: 400; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .logo-preview { width: 120px; height: 80px; object-fit: contain; border: 1px solid var(--border); background: var(--bg); padding: 8px; margin-bottom: 12px; display: block; }
    .logo-drop { border: 2px dashed var(--border2); padding: 28px; text-align: center; cursor: pointer; color: var(--ink-mid); font-size: 13px; transition: all 0.15s; }
    .logo-drop:hover { border-color: var(--gold); color: var(--ink); background: var(--gold-light); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: white; padding: 12px 20px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity 0.25s; pointer-events: none; box-shadow: var(--shadow); }
    .toast.show { opacity: 1; }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>

<!-- Auth gate -->
<div id="authGate" class="auth-gate">
  <div class="auth-logo">ReadyProof</div>
  <div class="auth-sub">Studio Admin</div>
  <div class="auth-box">
    <input type="password" class="auth-input" id="secretInput" placeholder="Admin secret key" onkeydown="if(event.key==='Enter')login()">
    <button class="auth-btn" onclick="login()">Sign In →</button>
    <span class="auth-error" id="authError"></span>
  </div>
</div>

<!-- Main app -->
<div id="mainApp" style="display:none">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>ReadyProof</h1>
        <p>Studio Admin</p>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Sessions</div>
        <div class="nav-item active" onclick="showView('all')">All Sessions <span class="nav-badge" id="nb-all">0</span></div>
        <div class="nav-item" onclick="showView('submitted')">Needs Editor <span class="nav-badge alert" id="nb-submitted">0</span></div>
        <div class="nav-item" onclick="showView('reviewing')">Reviewing <span class="nav-badge" id="nb-reviewing">0</span></div>
        <div class="nav-item" onclick="showView('editing')">In Editing <span class="nav-badge" id="nb-editing">0</span></div>
        <div class="nav-item" onclick="showView('complete')">Complete <span class="nav-badge" id="nb-complete">0</span></div>
        <div class="nav-section">Studio</div>
        <div class="nav-item" onclick="showView('settings')">Settings &amp; Branding</div>
      </nav>
      <div class="sidebar-footer" style="font-size:11px;color:var(--ink-faint);">ReadyProof © 2026</div>
    </aside>

    <main class="main" id="mainContent">
      <p style="color:var(--ink-faint)">Loading…</p>
    </main>
  </div>
</div>

<!-- New / Edit Session Modal -->
<div class="modal-backdrop" id="sessionModal">
  <div class="modal">
    <button class="modal-close" onclick="closeSessionModal()">✕</button>
    <h3 id="sessionModalTitle">New Client Session</h3>
    <input type="hidden" id="f_id">
    <div class="form-grid-2">
      <div class="form-row"><label>Client Name *</label><input type="text" id="f_name" placeholder="Jane Smith"></div>
      <div class="form-row"><label>Client Email *</label><input type="email" id="f_email" placeholder="jane@example.com"></div>
    </div>
    <div class="form-row"><label>Dropbox Shared Folder Link *</label><input type="url" id="f_link" placeholder="https://www.dropbox.com/sh/…"><p class="hint">The shared link you created for this session's folder in Dropbox</p></div>
    <div class="form-grid-3">
      <div class="form-row"><label>Package Name</label><input type="text" id="f_package" placeholder="Essential 20"></div>
      <div class="form-row"><label>Images Included</label><input type="number" id="f_num" placeholder="20" min="0"></div>
      <div class="form-row"><label>Balance Owed ($)</label><input type="number" id="f_balance" placeholder="0.00" min="0" step="0.01"></div>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>Payment Status</label>
        <select id="f_payment_status">
          <option value="unpaid">Unpaid</option>
          <option value="partial">Partial</option>
          <option value="paid">Paid</option>
        </select>
      </div>
      <div class="form-row"><label>Payment Notes</label><input type="text" id="f_payment_notes" placeholder="e.g. 50% deposit received"></div>
    </div>
    <div class="form-row"><label>Studio Notes (internal only)</label><textarea id="f_notes" rows="2" placeholder="Any notes about this session…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeSessionModal()">Cancel</button>
      <button class="btn btn-gold" id="sessionModalSaveBtn" onclick="saveSession()">Create Session</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminSecret = '';
let allSessions = [];
let currentView = 'all';

// ── Auth ──────────────────────────────────────────────────────────────────────
const stored = sessionStorage.getItem('rp_admin_secret');
if (stored) { adminSecret = stored; showApp(); }

async function login() {
  const secret = document.getElementById('secretInput').value.trim();
  if (!secret) return;
  const res = await fetch('/api/admin/sessions', { headers: { 'x-admin-secret': secret } });
  if (res.ok) {
    adminSecret = secret;
    sessionStorage.setItem('rp_admin_secret', secret);
    showApp();
  } else {
    document.getElementById('authError').textContent = 'Incorrect secret key';
  }
}

function showApp() {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadSessions();
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadSessions() {
  const res = await fetch('/api/admin/sessions', { headers: { 'x-admin-secret': adminSecret } });
  allSessions = await res.json();

  const counts = { all: allSessions.length };
  allSessions.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });
  ['all','pending','reviewing','submitted','editing','complete'].forEach(k => {
    const el = document.getElementById(`nb-${k}`);
    if (el) el.textContent = counts[k] || 0;
  });

  if (currentView !== 'settings') renderView();
}

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  renderView();
}

function renderView() {
  if (currentView === 'settings') { renderSettings(); return; }
  const titles = { all: 'All Sessions', submitted: 'Needs Editor Brief', reviewing: 'Client Reviewing', editing: 'In Editing', complete: 'Complete' };
  const list = currentView === 'all' ? allSessions : allSessions.filter(s => s.status === currentView);
  const counts = { all: allSessions.length };
  allSessions.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });

  const balanceOwed = allSessions.filter(s => s.payment_status !== 'paid').reduce((sum, s) => sum + (s.balance_owed || 0), 0);
  const needsEditor = counts.submitted || 0;

  document.getElementById('mainContent').innerHTML = `
    <div class="page-header">
      <h2>${titles[currentView] || 'Sessions'}</h2>
      <div class="page-actions">
        <button class="btn btn-gold" onclick="openNewSessionModal()">＋ New Session</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-value">${counts.all || 0}</div><div class="stat-label">Total Sessions</div></div>
      <div class="stat-card ${needsEditor > 0 ? 'highlight' : ''}"><div class="stat-value">${needsEditor}</div><div class="stat-label">Needs Editor</div></div>
      <div class="stat-card"><div class="stat-value">${counts.editing || 0}</div><div class="stat-label">In Editing</div></div>
      <div class="stat-card ${balanceOwed > 0 ? 'highlight' : ''}"><div class="stat-value">$${balanceOwed.toFixed(0)}</div><div class="stat-label">Balance Owed</div></div>
    </div>
    <div class="sessions-grid" id="sessionsGrid">
      ${list.length === 0
        ? `<p style="color:var(--ink-faint);font-size:13px;padding:20px 0;">No sessions${currentView !== 'all' ? ' in this status' : ''}.</p>`
        : list.map(renderSessionCard).join('')}
    </div>
  `;
}

function renderSessionCard(s) {
  const galleryUrl = `${location.origin}/gallery/${s.magic_token}`;
  const statusLabels = { pending: 'Not Opened', reviewing: 'Reviewing', submitted: 'Selection Ready', editing: 'In Editing', complete: 'Complete' };
  const created = new Date(s.created_at + 'Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const submitted = s.submitted_at ? new Date(s.submitted_at + 'Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : null;

  const paymentClass = { paid: 'payment-paid', unpaid: 'payment-unpaid', partial: 'payment-partial' }[s.payment_status] || 'payment-unpaid';
  const paymentLabel = { paid: '✓ Paid', unpaid: 'Unpaid', partial: 'Partial' }[s.payment_status] || 'Unpaid';

  const canSendInvite = ['pending','reviewing'].includes(s.status);
  const canSendEditor = s.status === 'submitted';
  const canViewBrief  = ['submitted','editing','complete'].includes(s.status);

  return `
    <div class="session-card" data-status="${s.status}" id="card-${s.id}">
      <div class="session-top">
        <div>
          <div class="session-name">${s.client_name}</div>
          <div class="session-email">${s.client_email}</div>
        </div>
        <span class="status-pill status-${s.status}">${statusLabels[s.status]}</span>
      </div>
      <div class="session-meta">
        <span>📅 Created <strong>${created}</strong></span>
        ${s.package_name ? `<span>📦 <strong>${s.package_name}</strong> (${s.num_included} images)</span>` : ''}
        ${s.favorite_count > 0 ? `<span>♥ <strong>${s.favorite_count}</strong> favorites</span>` : ''}
        ${s.selected_count > 0 ? `<span>✓ <strong>${s.selected_count}</strong> selected</span>` : ''}
        ${submitted ? `<span>📨 Submitted <strong>${submitted}</strong></span>` : ''}
        ${s.order_count > 0 ? `<span>🛒 <strong>${s.order_count}</strong> add-on${s.order_count !== 1 ? 's' : ''}</span>` : ''}
        <span class="payment-badge ${paymentClass}">${paymentLabel}${s.balance_owed > 0 ? ` — $${Number(s.balance_owed).toFixed(2)}` : ''}</span>
      </div>
      <div class="gallery-link-row">
        <span class="gallery-link-text">${galleryUrl}</span>
        <button class="link-action" onclick="copyLink('${galleryUrl}')">Copy</button>
        <a href="${galleryUrl}" target="_blank" class="link-action">Open ↗</a>
        <a href="${galleryUrl}" target="_blank" class="link-action">Preview as Client ↗</a>
      </div>
      <div class="session-actions">
        ${canSendInvite ? `<button class="btn btn-sm btn-outline" onclick="sendInvite('${s.id}', this)">✉ Send Invite</button>` : ''}
        ${canSendEditor ? `<button class="btn btn-sm btn-success" onclick="sendEditorBrief('${s.id}', this)">📋 Send Editor Brief</button>` : ''}
        ${canViewBrief  ? `<button class="btn btn-sm btn-outline" onclick="toggleBrief('${s.id}', this)">View Brief ▾</button>` : ''}
        ${s.status === 'editing' ? `<button class="btn btn-sm btn-outline" onclick="markComplete('${s.id}')">✓ Mark Complete</button>` : ''}
        <button class="btn btn-sm btn-outline" onclick="openEditSessionModal('${s.id}')">✏ Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSession('${s.id}', '${s.client_name.replace(/'/g,"\\'")}')">Delete</button>
      </div>
      <div class="brief-panel" id="brief-${s.id}"></div>
    </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function sendInvite(id, btn) {
  btn.disabled = true; btn.textContent = 'Sending…';
  const res = await api('POST', `/api/admin/sessions/${id}/invite`);
  const data = await res.json();
  if (res.ok) toast('Gallery invite sent!', 'success');
  else toast(data.error || 'Failed', 'error');
  btn.disabled = false; btn.textContent = '✉ Send Invite';
}

async function sendEditorBrief(id, btn) {
  btn.disabled = true; btn.textContent = 'Sending…';
  const res = await api('POST', `/api/admin/sessions/${id}/send-editor`);
  const data = await res.json();
  if (res.ok) { toast(data.message, 'success'); await loadSessions(); }
  else toast(data.error || 'Failed', 'error');
}

async function markComplete(id) {
  const res = await api('PATCH', `/api/admin/sessions/${id}`, { status: 'complete' });
  if (res.ok) { await loadSessions(); toast('Marked as complete', 'success'); }
}

async function deleteSession(id, name) {
  if (!confirm(`Delete session for ${name}? This cannot be undone.`)) return;
  const res = await api('DELETE', `/api/admin/sessions/${id}`);
  if (res.ok) { await loadSessions(); toast('Session deleted', 'success'); }
}

async function toggleBrief(id, btn) {
  const panel = document.getElementById(`brief-${id}`);
  const isOpen = panel.classList.toggle('open');
  btn.textContent = isOpen ? 'Hide Brief ▴' : 'View Brief ▾';
  if (!isOpen) return;

  panel.innerHTML = '<p style="color:var(--ink-faint);font-size:13px;">Loading…</p>';
  const res = await api('GET', `/api/admin/sessions/${id}/brief`);
  const { session, selections, orders } = await res.json();

  let html = `<h4>Editor Brief — ${selections.length} files</h4>`;

  if (selections.length === 0) {
    html += '<p style="color:var(--ink-faint);font-size:13px;">No selections yet.</p>';
  } else {
    html += '<div class="brief-list">' + selections.map((s, i) => `
      <div class="brief-item">
        <span class="brief-num">${i+1}.</span>
        <span class="brief-filename">${s.filename}</span>
        ${s.is_favorite ? '<span class="brief-fav">★</span>' : ''}
        ${s.client_note ? `<span class="brief-note">"${s.client_note}"</span>` : ''}
      </div>`).join('') + '</div>';
  }

  if (orders && orders.length > 0) {
    html += `<h4 style="margin-top:20px;">Add-on Orders (${orders.length})</h4>`;
    html += orders.map(o => `
      <div class="order-item">
        <div>
          <div class="order-type">${o.order_type}</div>
          ${o.details ? `<div class="order-detail">${o.details}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${o.price > 0 ? `<span style="font-size:13px;font-weight:500;">$${Number(o.price).toFixed(2)}</span>` : ''}
          <span class="status-pill order-status status-${o.status}">${o.status}</span>
        </div>
      </div>`).join('');
  }

  panel.innerHTML = html;
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => toast('Gallery link copied!', 'success'));
}

// ── Session Modal ─────────────────────────────────────────────────────────────
function openNewSessionModal() {
  document.getElementById('sessionModalTitle').textContent = 'New Client Session';
  document.getElementById('sessionModalSaveBtn').textContent = 'Create Session';
  document.getElementById('f_id').value = '';
  ['f_name','f_email','f_link','f_package','f_num','f_balance','f_payment_notes','f_notes'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_payment_status').value = 'unpaid';
  document.getElementById('sessionModal').classList.add('open');
}

function openEditSessionModal(id) {
  const s = allSessions.find(s => s.id === id);
  if (!s) return;
  document.getElementById('sessionModalTitle').textContent = 'Edit Session';
  document.getElementById('sessionModalSaveBtn').textContent = 'Save Changes';
  document.getElementById('f_id').value = s.id;
  document.getElementById('f_name').value = s.client_name || '';
  document.getElementById('f_email').value = s.client_email || '';
  document.getElementById('f_link').value = s.dropbox_link || '';
  document.getElementById('f_package').value = s.package_name || '';
  document.getElementById('f_num').value = s.num_included || '';
  document.getElementById('f_balance').value = s.balance_owed || '';
  document.getElementById('f_payment_status').value = s.payment_status || 'unpaid';
  document.getElementById('f_payment_notes').value = s.payment_notes || '';
  document.getElementById('f_notes').value = s.notes || '';
  document.getElementById('sessionModal').classList.add('open');
}

function closeSessionModal() { document.getElementById('sessionModal').classList.remove('open'); }
document.getElementById('sessionModal').addEventListener('click', function(e) { if (e.target === this) closeSessionModal(); });

async function saveSession() {
  const id = document.getElementById('f_id').value;
  const name = document.getElementById('f_name').value.trim();
  const email = document.getElementById('f_email').value.trim();
  const link = document.getElementById('f_link').value.trim();
  if (!name || !email || !link) { toast('Name, email, and Dropbox link are required', 'error'); return; }

  const body = {
    client_name: name, client_email: email, dropbox_link: link,
    package_name: document.getElementById('f_package').value.trim() || null,
    num_included: parseInt(document.getElementById('f_num').value) || 0,
    balance_owed: parseFloat(document.getElementById('f_balance').value) || 0,
    payment_status: document.getElementById('f_payment_status').value,
    payment_notes: document.getElementById('f_payment_notes').value.trim() || null,
    notes: document.getElementById('f_notes').value.trim() || null,
  };

  let res;
  if (id) {
    res = await api('PATCH', `/api/admin/sessions/${id}`, body);
  } else {
    res = await api('POST', '/api/admin/sessions', body);
  }

  const data = await res.json();
  if (res.ok) {
    closeSessionModal();
    await loadSessions();
    toast(id ? 'Session updated!' : 'Session created!', 'success');
  } else {
    toast(data.error || 'Failed', 'error');
  }
}

// ── Settings ──────────────────────────────────────────────────────────────────
async function renderSettings() {
  const res = await api('GET', '/api/admin/settings');
  const settings = await res.json();

  document.getElementById('mainContent').innerHTML = `
    <div class="page-header"><h2>Settings &amp; Branding</h2></div>

    <div class="settings-section">
      <h3>Studio Logo</h3>
      <p style="font-size:13px;color:var(--ink-mid);margin-bottom:16px;">This logo appears on your clients' gallery pages.</p>
      ${settings.logo_path ? `<img src="${settings.logo_path}" class="logo-preview" id="logoPreview" alt="Studio logo">` : ''}
      <div class="logo-drop" id="logoDrop" onclick="document.getElementById('logoInput').click()">
        ${settings.logo_path ? 'Click to replace logo' : '📁 Click to upload your logo (PNG, JPG, SVG)'}
      </div>
      <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(this)">
      ${settings.logo_path ? `<button class="btn btn-sm btn-danger" style="margin-top:10px;" onclick="removeLogo()">Remove Logo</button>` : ''}
    </div>

    <div class="settings-section">
      <h3>Studio Name</h3>
      <p style="font-size:13px;color:var(--ink-mid);margin-bottom:16px;">Shown on the gallery when no logo is uploaded.</p>
      <div style="display:flex;gap:10px;align-items:center;">
        <input type="text" id="studioNameInput" value="${settings.studio_name || ''}" placeholder="Your Studio Name" style="border:1px solid var(--border2);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;flex:1;max-width:360px;">
        <button class="btn btn-primary" onclick="saveStudioName()">Save</button>
      </div>
    </div>
  `;
}

async function uploadLogo(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const res = await api('POST', '/api/admin/settings/logo', { dataUrl: e.target.result, filename: file.name });
    if (res.ok) { toast('Logo uploaded!', 'success'); renderSettings(); }
    else toast('Upload failed', 'error');
  };
  reader.readAsDataURL(file);
}

async function removeLogo() {
  const res = await api('DELETE', '/api/admin/settings/logo');
  if (res.ok) { toast('Logo removed', 'success'); renderSettings(); }
}

async function saveStudioName() {
  const name = document.getElementById('studioNameInput').value.trim();
  const res = await api('POST', '/api/admin/settings/studio-name', { name });
  if (res.ok) toast('Studio name saved!', 'success');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function api(method, path, body) {
  return fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
    body: body ? JSON.stringify(body) : undefined,
  });
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 4000);
}

setInterval(() => { if (adminSecret && currentView !== 'settings') loadSessions(); }, 60000);
</script>
</body>
</html>
